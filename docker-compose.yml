x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
  API_KEY: ${API_KEY:?set API_KEY in .env}
  VERSION: ${VERSION:-0.0.0-dev}
  GIT_SHA: ${GIT_SHA:-unknown}
  BUILT_AT: ${BUILT_AT:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    # The only container that publishes a port.
    ports:
      - "80:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      # Needed for the root-run Caddy process to bind port 80.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    environment: *app-env
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["dropme-worker"]
    environment: *app-env
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker serves no HTTP port; liveness is the heartbeat key it writes.
      test: ["CMD", "python", "-c", "import os,redis,sys; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL']).exists('worker:heartbeat') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Let RQ finish the in-flight job on SIGTERM before the container is killed.
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dropme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backup:
    image: postgres:16-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    command: ["bash", "/ops/cron/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-dropme}
      GIT_SHA: ${GIT_SHA:-unknown}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
    volumes:
      - ./ops:/ops:ro
      - ./backups:/backups
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  alert-sink:
    build:
      context: .
      dockerfile: observability/alert-sink/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    # Localhost only — not exposed on the public edge.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  prom-data:
  grafana-data:
