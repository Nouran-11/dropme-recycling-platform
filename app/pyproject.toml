[project]
name = "dropme"
version = "0.1.0"
description = "Drop Me recycling event ingestion and processing API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    # Pinned floor to clear CVE-2025-62727 / CVE-2026-48818 / CVE-2026-54283.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<6",
    "rq>=2.0,<3",
    "structlog>=24.4,<25",
    "prometheus-client>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropme"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection intentionally calls these in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
pythonpath = ["src"]
