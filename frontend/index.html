<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drop Me — Events</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        max-width: 1100px;
        margin-inline: auto;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0;
      }
      #status {
        opacity: 0.7;
        font-size: 0.9rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid rgba(128, 128, 128, 0.3);
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
      }
      .status-processed {
        color: #1a7f37;
      }
      .status-failed {
        color: #cf222e;
      }
      .status-received,
      .status-processing {
        opacity: 0.75;
      }
      .empty {
        opacity: 0.6;
        padding: 1rem 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Drop Me — Events</h1>
      <span id="status">loading…</span>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <table>
      <thead>
        <tr>
          <th>Machine</th>
          <th>Material</th>
          <th>Items</th>
          <th>Status</th>
          <th>Weight (g)</th>
          <th>Event time</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No events yet.</p>
    <script src="app.js"></script>
  </body>
</html>
